version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /next-graphql-mongo
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /vue-dashboard
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: bundler
    directory: /rails-api
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: composer
    directory: /php-realestate-crm
    schedule: { interval: weekly }
  - package-ecosystem: composer
    directory: /wordpress-plugin
    schedule: { interval: weekly }

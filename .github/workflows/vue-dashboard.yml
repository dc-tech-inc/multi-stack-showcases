name: vue-dashboard

on:
  push:
    branches: [main]
    paths: ["vue-dashboard/**", ".github/workflows/vue-dashboard.yml"]
  pull_request:
    paths: ["vue-dashboard/**", ".github/workflows/vue-dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: vue-dashboard

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vue-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with coverage
        run: |
          set -o pipefail
          npm run test:coverage | tee coverage.txt
          { echo '### vue-dashboard coverage'; echo '```'; sed -n '/Coverage summary/,/====/p' coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
